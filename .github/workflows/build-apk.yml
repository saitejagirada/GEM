name: Build GeM Mobile Companion APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'companion_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test & Build Standalone Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      CI: 1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Install Dependencies
        working-directory: companion_app
        run: |
          npm install --legacy-peer-deps

      - name: Run Unit Tests (TDD Verification)
        working-directory: companion_app
        run: |
          npm test

      - name: Prebuild Android Native Files
        working-directory: companion_app
        run: |
          npx expo prebuild --platform android --clean --no-install --non-interactive

      - name: Bundle Offline JavaScript into Android Assets
        working-directory: companion_app
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res || npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res
          ls -la android/app/src/main/assets/

      - name: Build Standalone Android APK with Gradle
        working-directory: companion_app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m" --no-daemon --stacktrace

      - name: Upload Standalone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gem-companion-standalone-apk
          path: companion_app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
