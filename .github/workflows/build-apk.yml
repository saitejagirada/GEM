name: Build GeM Mobile Companion APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'companion_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test & Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'companion_app/package.json'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        working-directory: companion_app
        run: |
          npm ci || npm install

      - name: Run Unit Tests (TDD Verification)
        working-directory: companion_app
        run: |
          npm test

      - name: Prebuild Android Native Files
        working-directory: companion_app
        run: |
          npx expo prebuild --platform android --clean --no-install

      - name: Build Android Debug APK with Gradle
        working-directory: companion_app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gem-companion-debug-apk
          path: companion_app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
