name: Build GeM Mobile Companion APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'companion_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test & Build Standalone Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      CI: 1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Install Dependencies
        working-directory: companion_app
        run: |
          npm install --legacy-peer-deps

      - name: Run Unit Tests (TDD Verification)
        working-directory: companion_app
        run: |
          npm test

      - name: Prebuild Android Native Files
        working-directory: companion_app
        run: |
          npx expo prebuild --platform android --clean --no-install --non-interactive

      - name: Configure Standalone Offline Bundle & Signing
        working-directory: companion_app/android
        run: |
          # 1. Ensure release build is signed with debug keystore so it installs on any device without manual keys
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' app/build.gradle || true

          # 2. Enable bundleInDebug so the JS bundle is always packaged offline inside the APK
          sed -i '/react {/a \    bundleInDebug = true' app/build.gradle || true

      - name: Build Standalone Android APK with Gradle
        working-directory: companion_app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m" --no-daemon --stacktrace || ./gradlew assembleDebug -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m" --no-daemon --stacktrace

      - name: Upload Standalone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gem-companion-standalone-apk
          path: companion_app/android/app/build/outputs/apk/*/*/*.apk
          retention-days: 14

      - name: Upload Gradle Diagnostics on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-diagnostics
          path: |
            companion_app/android/app/build/reports/
            companion_app/android/build.log
          retention-days: 3
